version: "3.8"

services:
  api:
    build: .
    container_name: geospatial_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - REQUIRE_AUTH=true
      - API_KEY=secret_dev_key_123
      - LOG_LEVEL=INFO
      # For a real production app, use PostgreSQL
      - DATABASE_URL=sqlite:///./geospatial.db
    volumes:
      - geo_data:/app/data

volumes:
  geo_data:
