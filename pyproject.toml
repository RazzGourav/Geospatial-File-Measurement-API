[project]
name = "geospatial-measurement-api"
version = "1.0.0"
description = "A backend service for ingesting KML and Shapefile archives, extracting geospatial features, and returning measurement results with explicit CRS handling."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.5.0,<3.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.35,<3.0",
    "alembic>=1.13.0,<2.0",
    "geopandas>=1.0.0,<2.0",
    "shapely>=2.0.0,<3.0",
    "pyproj>=3.6.0,<4.0",
    "fiona>=1.10.0,<2.0",
    "lxml>=5.0.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-cov>=5.0.0,<6.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "httpx>=0.27.0,<1.0",
    "ruff>=0.6.0,<1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60
